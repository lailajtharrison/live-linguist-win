name: winui

# De-risk: does a REAL WinUI 3 app build and screenshot headlessly on windows-latest?
on:
  push:
    branches: [ main ]
    paths:
      - 'winui/**'
      - 'global.json'
      - '.github/workflows/winui.yml'
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Use Visual Studio's MSBuild (not `dotnet build`): the WinUI/MSIX PRI task
      # DLL (Microsoft.Build.Packaging.Pri.Tasks.ExpandPriContent) ships with VS's
      # MSBuild AppxPackage tooling, not the .NET SDK.
      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Restore (VS MSBuild)
        run: msbuild winui\LiveLinguistWinUI.csproj -t:restore -p:Configuration=Release -p:Platform=x64 -nologo

      - name: Build (WinUI 3, x64, self-contained unpackaged)
        run: msbuild winui\LiveLinguistWinUI.csproj -t:build -p:Configuration=Release -p:Platform=x64 -nologo

      - name: Launch app + capture screenshot
        shell: pwsh
        env:
          SCREENSHOT_PATH: ${{ github.workspace }}\screenshot.png
        run: |
          $exe = Get-ChildItem -Recurse -Filter LiveLinguistWinUI.exe winui\bin | Select-Object -First 1
          if (-not $exe) { throw "LiveLinguistWinUI.exe not found under winui\bin" }
          Write-Host "Launching $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "app did not exit within 90s" }
          Write-Host "app exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "app reported failure (exit $($p.ExitCode))" }

      - name: Verify screenshot
        shell: pwsh
        run: |
          if (-not (Test-Path screenshot.png)) { throw "screenshot.png was not produced" }
          $len = (Get-Item screenshot.png).Length
          Write-Host "screenshot.png is $len bytes"
          if ($len -lt 2000) { throw "screenshot.png suspiciously small ($len bytes)" }
          # TEMP (ui-polish): artifact storage quota is full, so print the PNGs to the log.
          # A second run with SCREENSHOT_VIEW=main captures the screen after the welcome.
          $exe = Get-ChildItem -Recurse -Filter LiveLinguistWinUI.exe winui\bin | Select-Object -First 1
          $env:SCREENSHOT_VIEW = "main"; $env:SCREENSHOT_PATH = "$pwd\screenshot-main.png"
          $p = Start-Process -FilePath $exe.FullName -PassThru; $p.WaitForExit(90000) | Out-Null
          foreach ($f in "screenshot.png", "screenshot-main.png") {
            Write-Host "PNGB64-BEGIN $f"
            Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes($f)))
          }

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: winui-screenshot
          path: screenshot.png
          if-no-files-found: error
